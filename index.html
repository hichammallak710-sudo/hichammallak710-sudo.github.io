<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hicham MALLAK – Ingénieur en Génie Rural</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #04070b;
            --bg-card: #0a0f17;
            --bg-card-tint: #071626;
            --border-card: #152030;
            --border-accent: #134270;
            --blue: #0284c7;
            --blue-bright: #38bdf8;
            --blue-ice: #bae6fd;
            --text-white: #f8fafc;
            --text-gray: #94a3b8;
            --text-muted: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-white);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* Barre de navigation */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(4, 7, 11, 0.85);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(56, 189, 248, 0.08);
            z-index: 1000;
        }

        .nav-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            color: var(--text-white);
            text-decoration: none;
            font-weight: 800;
            font-size: 1.05rem;
            letter-spacing: -0.02em;
        }

        .menu-toggle {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 6px;
        }

        .menu-toggle span {
            display: block;
            width: 22px;
            height: 2px;
            background-color: var(--text-white);
            border-radius: 2px;
            transition: transform 0.25s ease, opacity 0.25s ease;
        }

        .menu-toggle.active span:nth-child(1) {
            transform: translateY(7px) rotate(45deg);
        }

        .menu-toggle.active span:nth-child(2) {
            opacity: 0;
        }

        .menu-toggle.active span:nth-child(3) {
            transform: translateY(-7px) rotate(-45deg);
        }

        .dropdown-menu {
            display: none;
            flex-direction: column;
            background-color: #060b12;
            border-top: 1px solid var(--border-card);
            border-bottom: 1px solid var(--border-card);
            padding: 10px 24px 20px;
        }

        .dropdown-menu.open {
            display: flex;
        }

        .dropdown-menu a {
            color: var(--text-white);
            text-decoration: none;
            font-weight: 700;
            font-size: 1rem;
            padding: 12px 0;
            transition: color 0.2s, padding-left 0.2s;
        }

        .dropdown-menu a:hover {
            color: var(--blue-bright);
            padding-left: 6px;
        }

        /* Section Hero */
        .hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 110px 20px 40px;
        }

        .hero-glow {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            height: 640px;
            background: radial-gradient(ellipse 78% 62% at 50% 16%, rgba(14, 165, 233, 0.30) 0%, rgba(2, 132, 199, 0.10) 45%, rgba(4, 7, 11, 0) 76%);
            pointer-events: none;
            z-index: 0;
        }

        .hero-content {
            position: relative;
            z-index: 1;
            max-width: 720px;
            width: 100%;
        }

        .avatar-wrapper {
            width: 156px;
            height: 156px;
            margin: 0 auto 28px;
            border-radius: 26px;
            overflow: hidden;
            box-shadow: 0 0 55px rgba(56, 189, 248, 0.32);
            border: 1px solid rgba(56, 189, 248, 0.38);
            background: #0c1622;
        }

        .avatar-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .avatar-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #0e253d, #070e17);
            color: var(--blue-bright);
        }

        .hero-title {
            font-size: clamp(2.4rem, 6vw, 3.65rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            color: var(--text-white);
            margin-bottom: 10px;
            line-height: 1.1;
        }

        .hero-role {
            color: var(--blue-bright);
            font-size: 0.92rem;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .hero-specialty {
            color: var(--blue-ice);
            font-size: 0.98rem;
            font-weight: 500;
            margin-bottom: 28px;
            opacity: 0.9;
        }

        /* Icônes sociales circulaires */
        .social-circles {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-bottom: 30px;
        }

        .circle-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-color: #0c141f;
            border: 1px solid #1b293b;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.25s ease;
        }

        .circle-btn:hover {
            border-color: var(--blue-bright);
            color: var(--text-white);
            background-color: rgba(56, 189, 248, 0.14);
            transform: translateY(-2px);
        }

        .in-text {
            font-weight: 800;
            font-size: 1rem;
        }

        /* Boutons Hero */
        .hero-buttons {
            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
            margin-bottom: 48px;
        }

        .btn-white {
            background-color: #ffffff;
            color: #04070b;
            font-weight: 700;
            font-size: 0.92rem;
            padding: 13px 32px;
            border-radius: 9999px;
            text-decoration: none;
            transition: transform 0.2s, background-color 0.2s, box-shadow 0.2s;
        }

        .btn-white:hover {
            background-color: #e0f2fe;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(56, 189, 248, 0.22);
        }

        .btn-dark {
            background-color: rgba(56, 189, 248, 0.04);
            color: var(--text-white);
            border: 1px solid #1e2e42;
            font-weight: 600;
            font-size: 0.92rem;
            padding: 13px 26px;
            border-radius: 9999px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: border-color 0.2s, transform 0.2s, background-color 0.2s;
        }

        .btn-dark:hover {
            border-color: var(--blue-bright);
            background-color: rgba(56, 189, 248, 0.1);
            transform: translateY(-2px);
        }

        .scroll-down {
            display: inline-block;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 1.5rem;
            transition: color 0.2s, transform 0.2s;
        }

        .scroll-down:hover {
            color: var(--blue-bright);
            transform: translateY(3px);
        }

        /* Conteneur & Sections */
        .container {
            max-width: 920px;
            margin: 0 auto;
            padding: 0 20px 90px;
        }

        .section {
            padding-top: 80px;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 32px;
        }

        .header-bar {
            width: 36px;
            height: 3px;
            background-color: var(--blue-bright);
            border-radius: 2px;
            flex-shrink: 0;
        }

        .section-header h2 {
            font-size: clamp(1.65rem, 4vw, 2.15rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--text-white);
            white-space: nowrap;
        }

        .header-line {
            height: 1px;
            flex-grow: 1;
            background: linear-gradient(90deg, rgba(56, 189, 248, 0.45) 0%, rgba(56, 189, 248, 0) 100%);
        }

        /* Cartes */
        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 18px;
            padding: 26px 28px;
            margin-bottom: 18px;
            transition: border-color 0.25s ease, transform 0.25s ease;
        }

        .card:hover {
            border-color: #213652;
        }

        .card-tint {
            background-color: var(--bg-card-tint);
            border-color: var(--border-accent);
        }

        .card-tint:hover {
            border-color: #1c5d9e;
        }

        .card-tag {
            display: block;
            color: var(--blue-bright);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin-bottom: 14px;
        }

        .summary-text {
            color: #cbd5e1;
            font-size: 0.96rem;
            line-height: 1.75;
        }

        /* Formation */
